<main class="companies-page">
  <aside class="companies-menu" aria-label="Menú principal">
    <a class="companies-brand" href="#empresas"> UNI<span>TRACK</span> </a>
    <nav aria-label="Secciones de CO360">
      <button class="company-link" type="button">Alumnos</button>
      <button class="company-link active" type="button">Sesiones</button>
      <button class="company-link" type="button" routerLink="/asistencia">Asistencia</button>
      <button class="company-link" type="button">Entrega</button>
    </nav>
    <button class="company-logout" type="button">Cerrar sesión</button>
  </aside>
  <section class="companies-content" aria-labelledby="companies-title">
    <header class="companies-header">
      <section>
        <p class="companies-eyebrow">Gestión de sesiones > Crear sesion</p>
        <h1 id="companies-title">Crear Sesion</h1>
      </section>
      <section class="companies-account">
        <span>UC</span>
        <p>
          <strong>Usuario UNITRACK</strong>
          <small>Kellyn Delgado</small>
        </p>
      </section>
    </header>
    <form class="company-form">
      <section>
        <h2>Agregar sesión</h2>
        <p>Registra la información de la nueva sesión.</p>
      </section>
      <label class="form-label" for="new-company-name"> Materia </label>
      <select id="new-company-sector" class="form-control">
        <option value="Ingenieria de software">Software Design</option>
        <option value="Finanzas">Calculo I</option>
        <option value="Marketing">Gestion de procesos</option>
        <option value="Ingenieria industrial">Apps moviles</option>
      </select>
      <label class="form-label" for="new-company-sector"> Carrera </label>
      <select id="new-company-sector" class="form-control">
        <option value="Ingenieria de software">Ingeniería de software</option>
        <option value="Finanzas">Finanzas</option>
        <option value="Marketing">Marketing</option>
        <option value="Ingenieria industrial">Ingeniería industrial</option>
      </select>
      <label class="form-label" for="new-company-promotion"> Promoción </label>
      <select id="new-company-promotion" class="form-control">
        <option value="16A">16A</option>
        <option value="16B">16B</option>
        <option value="17A">17A</option>
        <option value="17B">17B</option>
      </select>
      <section class="company-form-actions">
        <button class="btn btn-outline-secondary" type="button" routerLink="/sesiones">
          Cancelar
        </button>
        <button class="btn btn-primary company-add" type="button" routerLink="/sesiones">
          Crear sesión
        </button>
      </section>
    </form>
  </section>
</main>
