<main class="auth-page">
  <section class="auth-panel" aria-labelledby="login-title">
    <aside class="auth-brand" aria-label="CO360">
      <a class="brand" href="#" aria-label="CO360, inicio">UNI<span>TRACK</span></a>

      <section class="brand-message">
        <i aria-hidden="true"></i>
        <h1>Gestión de asistencia</h1>
        <p>Accede a la plataforma para gestionar las sesiones y su asistencia.</p>
      </section>

      <small>Plataforma de asistencia</small>
    </aside>

    <section class="auth-form">
      <p class="eyebrow">Acceso seguro</p>
      <h2 id="login-title">Bienvenido de nuevo</h2>
      <p class="intro">Ingresa con tus credenciales para continuar.</p>

      <form>
        <label for="email" class="form-label">Correo institucional</label>
        <input id="email" class="form-control" type="email" placeholder="nombre@empresa.com" autocomplete="email" required>

        <label for="password" class="form-label mt-1">Contraseña</label>
        <section class="password-field">
          <input id="password" class="form-control">
          <button class="password-toggle" type="button"></button>
        </section>

        <section class="auth-options">
          <label class="form-check"><input class="form-check-input" type="checkbox"> <span>Recordarme</span></label>
          <a href="#recuperar">¿Olvidaste tu contraseña?</a>
        </section>

        <button class="btn btn-primary login-button" type="submit" routerLink="/sesiones">Iniciar sesión</button>
      </form>
      <p class="register-link">¿Aún no tienes cuenta? <button type="button" routerLink="/registrarse">Regístrate</button></p>
      <p class="auth-footer">UNITRACK · Plataforma de asistencia</p>
    </section>
  </section>
</main>
